name = "hamfilm-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# دیتابیس D1
[[d1_databases]]
binding = "DB"
database_name = "hamfilm"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# اتاق‌های WebSocket (Durable Objects)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# متغیرهای محیطی (با wrangler secret set)
# JWT_SECRET      → کلید امضای توکن‌ها
# ADMIN_KEY       → کلید ورود به پنل ادمین
